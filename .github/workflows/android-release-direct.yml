name: Android Release (Direct Link)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web to Android
        run: npx cap sync android

      - name: Prepare signing keystore from secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty. Please add it to repo secrets." >&2
            exit 1
          fi
          echo "Creating release.keystore from base64 secret"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ANDROID_KEYSTORE=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          # Mask sensitive values in logs
          echo "::add-mask::${ANDROID_KEYSTORE_PASSWORD}"
          echo "::add-mask::${ANDROID_KEY_PASSWORD}"

      - name: Build Release APK
        id: build_apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE: ${{ github.workspace }}/release.keystore
        run: |
          cd android
          # Pass explicit signing properties as a fallback and ensure release is signed
          ./gradlew assembleRelease \
            -PreleaseKeystoreFile="$ANDROID_KEYSTORE" \
            -PreleaseKeystorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" \
            -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"
          echo "Listing APK outputs for debugging:"
          ls -la app/build/outputs/apk/release || true
          # Prefer the signed APK explicitly; avoid picking *-unsigned.apk
          APK_DIR="app/build/outputs/apk/release"
          APK_CANDIDATE=""
          if [ -f "$APK_DIR/app-release.apk" ]; then
            APK_CANDIDATE="$APK_DIR/app-release.apk"
          else
            # Try to find any non-unsigned release APK
            APK_CANDIDATE=$(ls -1 $APK_DIR/*.apk 2>/dev/null | grep -v "-unsigned.apk$" | head -n 1 || true)
          fi
          if [ -z "$APK_CANDIDATE" ]; then
            echo "No signed APK found under $APK_DIR" >&2
            echo "Directory listing:" >&2
            ls -la "$APK_DIR" >&2 || true
            exit 1
          fi
          echo "Selected APK: $APK_CANDIDATE"
          echo "apk_path=$GITHUB_WORKSPACE/android/$APK_CANDIDATE" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release (stable tag)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build_apk.outputs.apk_path }}
          asset_name: app-release.apk
          tag: android-release-latest
          release_name: Android Release Latest
          overwrite: true
          body: |
            Automated signed Release APK from commit ${{ github.sha }}
            Built at run ${{ github.run_id }}

      - name: Generate APK QR code
        env:
          APK_URL: https://github.com/${{ github.repository }}/releases/download/android-release-latest/app-release.apk
        run: |
          python -m pip install --user "qrcode[pil]"
          python - <<'PY'
          import os, qrcode
          url = os.environ['APK_URL']
          img = qrcode.make(url)
          img.save('app-release-qr.png')
          print('Generated QR for', url)
          PY

      - name: Upload APK QR to GitHub Release (stable tag)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app-release-qr.png
          asset_name: app-release-qr.png
          tag: android-release-latest
          release_name: Android Release Latest
          overwrite: true
          body: |
            QR code image pointing to APK direct download
            See asset name for usage.

      - name: Build Release AAB (Play Store bundle)
        id: build_aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE: ${{ github.workspace }}/release.keystore
        run: |
          cd android
          ./gradlew bundleRelease \
            -PreleaseKeystoreFile="$ANDROID_KEYSTORE" \
            -PreleaseKeystorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" \
            -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"
          echo "Listing AAB outputs for debugging:"
          ls -la app/build/outputs/bundle/release || true
          AAB_PATH=$(ls -1 app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1 || true)
          if [ -z "$AAB_PATH" ]; then
            echo "No AAB found under app/build/outputs/bundle/release" >&2
            exit 1
          fi
          echo "Found AAB: $AAB_PATH"
          echo "aab_path=$GITHUB_WORKSPACE/android/$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload AAB to GitHub Release (stable tag)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build_aab.outputs.aab_path }}
          asset_name: app-release.aab
          tag: android-release-latest
          release_name: Android Release Latest
          overwrite: true
          body: |
            Automated signed Release AAB from commit ${{ github.sha }}
            Built at run ${{ github.run_id }}
